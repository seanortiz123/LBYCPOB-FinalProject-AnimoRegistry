<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead(${title})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('login')}"></nav>

<main class="auth-shell">
    <span class="eyebrow">Welcome back</span>
    <h1 style="font-size:28px;margin-top:6px">Log in</h1>
    <p class="muted" style="margin-bottom:24px">Use your DLSU email to pick up where you left off.</p>

    <div class="role-toggle">
        <button type="button" id="role-student" class="active" onclick="setRole('student')">Student</button>
        <button type="button" id="role-officer" onclick="setRole('officer')">Org officer</button>
    </div>
