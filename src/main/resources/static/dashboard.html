<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead(${title})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('dashboard')}"></nav>

<main class="page-body">
    <div class="wrap" style="padding-top:28px">
        <span class="eyebrow">Applicant dashboard</span>
        <h1 style="margin-top:4px;margin-bottom:24px" th:text="'Welcome back, ' + ${currentName}">My applications</h1>

        <div class="stat-grid" style="margin-bottom:28px">
            <div class="stat"><div class="num" th:text="${#lists.size(applications)}">0</div><div class="label">Total</div></div>
            <div class="stat"><div class="num" th:text="${pendingCount}">0</div><div class="label">Pending</div></div>
            <div class="stat"><div class="num" th:text="${interviewCount}">0</div><div class="label">Interview</div></div>
            <div class="stat"><div class="num" th:text="${acceptedCount}">0</div><div class="label">Accepted</div></div>
        </div>
