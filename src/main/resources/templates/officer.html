<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead(${title})}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav('officer')}"></nav>

<main class="page-body">
    <div class="wrap" style="padding-top:28px">
        <span class="eyebrow" th:text="${officer.position} + ' · Officer panel'">Officer panel</span>
        <h1 style="margin-top:4px;margin-bottom:20px" th:text="${org.name}">Org name</h1>

        <div class="form-error show" th:if="${officerError}" th:text="${officerError}"></div>
        <div class="form-success show" th:if="${officerSuccess}" th:text="${officerSuccess}"></div>
        <div class="form-success show" th:if="${feeReceipt}" th:text="${feeReceipt}"></div>

        <div class="two-col">
            <!-- ============ APPLICANTS ============ -->
            <div>
                <div class="tabs">
                    <a th:href="@{/officer}" th:classappend="${selectedStatus == null} ? 'active' : ''">All</a>
                    <a th:each="s : ${statuses}" th:href="@{/officer(status=${s})}" th:text="${s}"
                       th:classappend="${selectedStatus == s} ? 'active' : ''">STATUS</a>
                </div>

                <div th:if="${#lists.isEmpty(applications)}" class="empty-state">
                    <span class="eyebrow">No applicants</span>
                    <p>No applications match this filter yet.</p>
                </div>

                <div class="app-row" th:each="a : ${applications}">
                    <div class="app-row-top">
                        <div>
                            <div class="name" th:text="${a.applicant.name}">Name</div>
                            <div class="sub" th:text="${a.applicant.idNumber} + ' · ' + ${a.applicant.college} + ', ' + ${a.applicant.yearLevel} + ' · Applied ' + ${#temporals.format(a.dateApplied, 'MMM d, yyyy')}">Info</div>
                        </div>
                        <span class="badge" th:classappend="${a.status}" th:text="${a.status}">STATUS</span>
                    </div>
                    <p class="answers" th:if="${a.answers}" th:text="${a.answers}">Answers</p>
                    <div class="sub" style="margin-top:8px" th:if="${a.interviewSchedule}"
                         th:text="'Interview: ' + ${#temporals.format(a.interviewSchedule, 'MMM d, yyyy h:mm a')}">Interview</div>

                    <div class="actions">
                        <form th:action="@{/officer/applications/{id}/interview(id=${a.id})}" method="post" style="display:flex;gap:8px;align-items:center">
                            <input type="datetime-local" name="interviewSchedule" class="input" style="width:auto;padding:7px 10px;font-size:13px" required />
                            <button type="submit" class="btn btn-sm">Schedule interview</button>
                        </form>
                        <form th:action="@{/officer/applications/{id}/status(id=${a.id})}" method="post">
                            <input type="hidden" name="status" value="ACCEPTED" />
                            <button type="submit" class="btn btn-sm btn-primary" th:disabled="${a.status.name() == 'ACCEPTED'}">Accept</button>
                        </form>
                        <form th:action="@{/officer/applications/{id}/status(id=${a.id})}" method="post">
                            <input type="hidden" name="status" value="REJECTED" />
                            <button type="submit" class="btn btn-sm btn-danger" th:disabled="${a.status.name() == 'REJECTED'}">Reject</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

</body>
</html>
